title: Smart home — phone remote
kind: page
width: 420
height: 900
background: "#0b1118"
grid: 10
elements:
  - id: text1
    type: text
    x: 24
    y: 12
    w: 372
    h: 34
    props:
      text: Smart home — phone remote
      fontSize: 19
      color: "#e2e8f0"
      fontWeight: "700"
  - id: clock2
    type: clock
    x: 24
    y: 50
    w: 200
    h: 26
    props:
      format: datetime
      fontSize: 12
      color: "#94a3b8"
  - id: rect3
    type: rect
    x: 12
    y: 86
    w: 396
    h: 230
    props:
      fill: "#111b27"
      stroke: "#233244"
      radius: 10
    locked: true
  - id: text4
    type: text
    x: 26
    y: 92
    w: 368
    h: 22
    props:
      text: CLIMATE
      fontSize: 12
      color: "#64748b"
      fontWeight: "700"
  - id: thermostat5
    type: thermostat
    x: 24
    y: 110
    w: 190
    h: 190
    props:
      min: 14
      max: 28
    bindings:
      value:
        tag: Sites/MyHome/Temperature
      setpoint:
        tag: Sites/MyHome/Setpoint
      heating:
        tag: Sites/MyHome/Heating
  - id: button6
    type: button
    x: 236
    y: 130
    w: 160
    h: 56
    props:
      text: ＋ warmer
      fontSize: 18
      color: "#c2410c"
    events:
      click: await tags.write('Sites/MyHome/Setpoint', Math.min(27, tags.get('Sites/MyHome/Setpoint') + 0.5));
  - id: button7
    type: button
    x: 236
    y: 196
    w: 160
    h: 56
    props:
      text: － cooler
      fontSize: 18
      color: "#1d4ed8"
    events:
      click: await tags.write('Sites/MyHome/Setpoint', Math.max(15, tags.get('Sites/MyHome/Setpoint') - 0.5));
  - id: value8
    type: value
    x: 236
    y: 262
    w: 160
    h: 36
    props:
      tag: Sites/MyHome/Setpoint
      label: Set
      fontSize: 16
  - id: rect9
    type: rect
    x: 12
    y: 328
    w: 396
    h: 250
    props:
      fill: "#111b27"
      stroke: "#233244"
      radius: 10
    locked: true
  - id: text10
    type: text
    x: 26
    y: 334
    w: 368
    h: 22
    props:
      text: LIGHTS
      fontSize: 12
      color: "#64748b"
      fontWeight: "700"
  - id: lamp11
    type: lamp
    x: 24
    y: 360
    w: 50
    h: 60
    props: {}
    bindings:
      on:
        tag: Sites/MyHome/LivingLight
  - id: switch12
    type: switch
    x: 80
    y: 374
    w: 130
    h: 36
    props:
      tag: Sites/MyHome/LivingLight
      label: Living
      fontSize: 15
  - id: lamp13
    type: lamp
    x: 220
    y: 360
    w: 50
    h: 60
    props: {}
    bindings:
      on:
        tag: Sites/MyHome/KitchenLight
  - id: switch14
    type: switch
    x: 276
    y: 374
    w: 130
    h: 36
    props:
      tag: Sites/MyHome/KitchenLight
      label: Kitchen
      fontSize: 15
  - id: lamp15
    type: lamp
    x: 24
    y: 464
    w: 50
    h: 60
    props: {}
    bindings:
      on:
        tag: Sites/MyHome/BedroomLight
  - id: switch16
    type: switch
    x: 80
    y: 478
    w: 130
    h: 36
    props:
      tag: Sites/MyHome/BedroomLight
      label: Bedroom
      fontSize: 15
  - id: lamp17
    type: lamp
    x: 220
    y: 464
    w: 50
    h: 60
    props: {}
    bindings:
      on:
        tag: Sites/MyHome/PorchLight
  - id: switch18
    type: switch
    x: 276
    y: 478
    w: 130
    h: 36
    props:
      tag: Sites/MyHome/PorchLight
      label: Porch
      fontSize: 15
  - id: button19
    type: button
    x: 24
    y: 526
    w: 372
    h: 40
    props:
      text: All lights off
      color: "#334155"
      fontSize: 15
    events:
      click: |-
        await tags.writeMany({ 'Sites/MyHome/LivingLight': false, 'Sites/MyHome/KitchenLight': false, 'Sites/MyHome/BedroomLight': false, 'Sites/MyHome/PorchLight': false });
        ui.toast('Lights off', 'success');
  - id: rect20
    type: rect
    x: 12
    y: 590
    w: 396
    h: 160
    props:
      fill: "#111b27"
      stroke: "#233244"
      radius: 10
    locked: true
  - id: text21
    type: text
    x: 26
    y: 596
    w: 368
    h: 22
    props:
      text: SECURITY
      fontSize: 12
      color: "#64748b"
      fontWeight: "700"
  - id: door22
    type: door
    x: 30
    y: 620
    w: 56
    h: 84
    props: {}
    bindings:
      open:
        tag: Sites/MyHome/FrontDoor
  - id: text23
    type: text
    x: 20
    y: 708
    w: 80
    h: 20
    props:
      text: Front door
      fontSize: 11
      color: "#94a3b8"
      align: center
  - id: button24
    type: button
    x: 110
    y: 622
    w: 286
    h: 50
    props:
      text: Garage
      action: toggle
      tag: Sites/MyHome/Garage
      color: "#334155"
      activeColor: "#c2410c"
      confirm: true
      fontSize: 17
  - id: button25
    type: button
    x: 110
    y: 682
    w: 286
    h: 50
    props:
      text: Alarm armed
      action: toggle
      tag: Sites/MyHome/AlarmArmed
      color: "#334155"
      activeColor: "#7c3aed"
      confirm: true
      fontSize: 17
  - id: rect26
    type: rect
    x: 12
    y: 762
    w: 396
    h: 126
    props:
      fill: "#111b27"
      stroke: "#233244"
      radius: 10
    locked: true
  - id: text27
    type: text
    x: 26
    y: 768
    w: 368
    h: 22
    props:
      text: ENERGY
      fontSize: 12
      color: "#64748b"
      fontWeight: "700"
  - id: value28
    type: value
    x: 24
    y: 792
    w: 372
    h: 40
    props:
      tag: Sites/MyHome/Power
      label: Using now
      fontSize: 20
  - id: sparkline29
    type: sparkline
    x: 24
    y: 836
    w: 372
    h: 44
    props:
      tag: Sites/MyHome/Power
      color: "#f97316"
      decimals: 0
name: Sites/MyHome
