      - kind: device
        name: Line1
        driver: simulation
        description: Simulated equipment (replace driver with modbus-tcp / mqtt / rest for real hardware)
        settings:
          intervalMs: 1000
        children:
          - { kind: tag, name: Running, dataType: boolean, initial: true, writable: true, history: true }
          - { kind: tag, name: Speed, dataType: number, initial: 120, writable: true, unit: bpm, min: 0, max: 150, history: true }
          - { kind: tag, name: State, dataType: string, initial: Running, writable: true, states: { Running: Running, Stopped: Stopped, Fault: Fault, Starved: Starved }, alarms: [ { kind: equals, limit: Fault, severity: high, message: Line stopped on fault } ] }
          - { kind: tag, name: FaultStation, dataType: string, initial: "", writable: true }
          - { kind: tag, name: Good, dataType: number, initial: 0, writable: true, writeRole: operator, history: { interval: 60 } }
          - { kind: tag, name: Rejects, dataType: number, initial: 0, writable: true, writeRole: operator, history: { interval: 60 } }
          - { kind: tag, name: RunSeconds, dataType: number, initial: 1, writable: true, writeRole: operator }
          - { kind: tag, name: TotalSeconds, dataType: number, initial: 1, writable: true, writeRole: operator }
          - { kind: tag, name: Availability, expression: "tag('./RunSeconds') / Math.max(1, tag('./TotalSeconds')) * 100", history: true, unit: "%", decimals: 1 }
          - { kind: tag, name: Performance, expression: tag('./Speed') / 150 * 100, history: true, unit: "%", decimals: 1 }
          - { kind: tag, name: Quality, expression: "tag('./Good') / Math.max(1, tag('./Good') + tag('./Rejects')) * 100", history: true, unit: "%", decimals: 1 }
          - { kind: tag, name: OEE, expression: tag('./Availability') * tag('./Performance') * tag('./Quality') / 10000, history: true, unit: "%", decimals: 1, alarms: [ { kind: lo, limit: 60, severity: low, message: "OEE below target ({value}%)", delay: 60 } ] }
          - { kind: tag, name: FillerTemp, source: { fn: sine, min: 18, max: 26, period: 900 }, dataType: number, history: true, unit: °C, decimals: 1 }
