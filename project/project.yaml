              - { kind: tag, name: Capacity, dataType: number, initial: 800, writable: true, unit: m³, writeRole: engineer }
              - { kind: tag, name: Level, source: { fn: sine, min: 16, max: 86, period: 940, phase: 2 }, dataType: number, history: true, unit: "%", decimals: 1, alarms: [ { kind: hi, limit: 90, severity: high, message: "Tank T3 high level ({value}%)" }, { kind: lo, limit: 10, severity: medium, message: "Tank T3 low level ({value}%)" } ] }
              - { kind: tag, name: Temperature, source: { fn: sine, min: 14, max: 26, period: 1200 }, dataType: number, history: true, unit: °C, decimals: 1 }
              - { kind: tag, name: Volume, expression: tag('./Level') / 100 * tag('./Capacity'), history: true, unit: m³, decimals: 0 }
          - kind: folder
            name: T4
