              - { kind: tag, name: Level, source: { fn: sine, min: 12, max: 89, period: 770, phase: 1 }, dataType: number, history: true, unit: "%", decimals: 1, alarms: [ { kind: hi, limit: 90, severity: high, message: "Tank T2 high level ({value}%)" }, { kind: lo, limit: 10, severity: medium, message: "Tank T2 low level ({value}%)" } ] }
              - { kind: tag, name: Temperature, source: { fn: sine, min: 13, max: 25, period: 1200 }, dataType: number, history: true, unit: °C, decimals: 1 }
