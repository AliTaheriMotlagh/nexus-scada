          - { kind: tag, name: Compressor1, source: { fn: toggle, min: 0, max: 1, period: 420 }, dataType: boolean, history: true }
          - { kind: tag, name: Compressor2, source: { fn: toggle, min: 0, max: 1, period: 610 }, dataType: boolean, history: true }
