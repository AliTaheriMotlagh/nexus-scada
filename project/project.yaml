          - { kind: tag, name: FrontDoor, source: { fn: toggle, min: 0, max: 1, period: 300 }, dataType: boolean, history: false }
          - { kind: tag, name: Power, source: { fn: randomWalk, min: 150, max: 4200, step: 120 }, dataType: number, history: true, unit: W, decimals: 0 }
      - kind: device
        name: ali
        driver: simulation
        description: Simulated equipment (replace driver with modbus-tcp / mqtt / rest for real hardware)
        settings:
          intervalMs: 1000
        children:
          - { kind: tag, name: AirTemp, source: { fn: sine, min: 15, max: 34, period: 1200, noise: 0.2 }, dataType: number, history: true, unit: °C, decimals: 1, alarms: [ { kind: hi, limit: 33, severity: high, message: "Greenhouse too hot ({value} °C)" }, { kind: lo, limit: 12, severity: critical, message: "Frost risk ({value} °C)" } ] }
          - { kind: tag, name: Humidity, source: { fn: randomWalk, min: 45, max: 92, step: 1 }, dataType: number, history: true, unit: "%", decimals: 0, alarms: [ { kind: hi, limit: 90, severity: low, message: Humidity high — fungal risk, delay: 60 } ] }
          - { kind: tag, name: SoilMoisture, dataType: number, initial: 40, writable: true, unit: "%", decimals: 1, writeRole: engineer, history: true, alarms: [ { kind: lo, limit: 22, severity: medium, message: "Soil too dry ({value}%)" } ] }
          - { kind: tag, name: Light, source: { fn: sine, min: 0, max: 60000, period: 1800 }, dataType: number, history: true, unit: lx, decimals: 0 }
          - { kind: tag, name: CO2, source: { fn: randomWalk, min: 380, max: 1100, step: 12 }, dataType: number, history: true, unit: ppm, decimals: 0 }
          - { kind: tag, name: WaterTank, dataType: number, initial: 80, writable: true, unit: "%", decimals: 0, writeRole: engineer, history: true, alarms: [ { kind: lo, limit: 15, severity: medium, message: Irrigation water tank low } ] }
          - { kind: tag, name: Auto, dataType: boolean, initial: true, writable: true }
          - { kind: tag, name: Vents, dataType: number, initial: 10, writable: true, unit: "%", min: 0, max: 100, history: true }
