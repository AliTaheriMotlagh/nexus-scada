# ─────────────────────────────────────────────────────────────────────────────
#  Nexus SCADA — project configuration (configuration as code)
#
#  Everything in the runtime is defined here or in the sibling folders:
#    displays/  graphic pages & faceplates     scenes/   3D scenes
#    scripts/   server scripts (TypeScript)     .history/ automatic backups
#
#  Edit in the app (Config page / Tags page) or any text editor — changes hot-reload.
#  Tag paths follow the tree: Folder/Device/Folder/Tag, e.g. Plant/Area1/Tank1/Level
# ─────────────────────────────────────────────────────────────────────────────

project:
  name: Nexus Demo Plant & Smart Home
  description: Water treatment area with two tanks plus a connected home (IoT)
  version: 1.0.0

server:
  port: 8080
  anonymousRole: viewer # remove (or set null) to require login for viewing
  tokenTtlHours: 12
  historianRetentionDays: 30

location: { lat: 35.6892, lng: 51.389 } # used for @sunrise / @sunset schedules
startDisplay: Plant/Overview

users:
  - { username: admin, fullName: Administrator, role: admin, password: admin }
  - { username: engineer, fullName: Process Engineer, role: engineer, password: engineer }
  - { username: operator, fullName: Shift Operator, role: operator, password: operator }
  # Production: npm run hash-password -w server -- <password>   →  passwordHash: scrypt$...

nodes:
  # ═══════════════════════════ INDUSTRIAL PLANT ═══════════════════════════
  - kind: folder
    name: Plant
    description: Water treatment plant
    children:
      - kind: device
        name: Area1
        driver: simulation
        description: Process simulator (replace with modbus-tcp / mqtt / rest for real equipment)
        settings: { intervalMs: 500 }
        children:
          - kind: folder
            name: Tank1
            description: Raw water tank T-101
            children:
              - kind: tag
                name: Level
                unit: '%'
                min: 0
                max: 100
                decimals: 1
                initial: 42
                writable: true
                writeRole: engineer
                description: Tank level (integrated by the ProcessModel script)
                history: { deadband: 0.2, interval: 30 }
                alarms:
                  - { kind: hihi, limit: 95, severity: critical, message: 'T-101 level extremely high ({value}%)' }
                  - { kind: hi, limit: 85, severity: high, deadband: 1, message: 'T-101 level high ({value}%)' }
                  - { kind: lo, limit: 15, severity: high, deadband: 1, message: 'T-101 level low ({value}%)' }
                  - { kind: lolo, limit: 5, severity: critical, message: 'T-101 level extremely low ({value}%)' }
              - kind: tag
                name: Temperature
                unit: °C
                decimals: 1
                source: { fn: sine, min: 18, max: 34, period: 240, noise: 0.2 }
                history: { deadband: 0.1 }
                alarms:
                  - { kind: hi, limit: 33, severity: medium, delay: 5, message: 'T-101 water temperature high' }
              - { kind: tag, name: Setpoint, unit: '%', min: 10, max: 90, initial: 60, writable: true, history: true, description: Level setpoint (auto mode) }
              - { kind: tag, name: Mode, dataType: string, initial: Auto, writable: true, states: { Auto: Automatic, Manual: Manual } }
              - { kind: tag, name: InletValve, dataType: boolean, initial: true, writable: true, history: true, description: XV-101 inlet valve }
              - kind: folder
                name: Pump
                children:
                  - { kind: tag, name: Running, dataType: boolean, initial: true, writable: true, history: true, states: { 'false': Stopped, 'true': Running } }
                  - { kind: tag, name: Speed, unit: '%', min: 0, max: 100, initial: 50, writable: true, history: true }
                  - kind: tag
                    name: Current
                    unit: A
                    decimals: 1
                    expression: "tag('./Running') ? 4 + tag('./Speed') * 0.18 : 0"
                    history: true
                    alarms:
                      - { kind: hi, limit: 20, severity: high, message: 'P-101 motor overload ({value} A)' }
          - kind: folder
            name: Tank2
            description: Treated water tank T-102
            children:
              - kind: tag
                name: Level
                unit: '%'
                min: 0
                max: 100
                decimals: 1
                initial: 70
                writable: true
                writeRole: engineer
                history: { deadband: 0.2, interval: 30 }
                alarms:
                  - { kind: hi, limit: 90, severity: high, message: 'T-102 level high ({value}%)' }
                  - { kind: lo, limit: 10, severity: high, message: 'T-102 level low ({value}%)' }
              - kind: tag
                name: Temperature
                unit: °C
                decimals: 1
                source: { fn: sine, min: 16, max: 26, period: 400, phase: 1.2, noise: 0.15 }
                history: true
              - { kind: tag, name: Setpoint, unit: '%', min: 10, max: 90, initial: 50, writable: true, history: true }
              - { kind: tag, name: Mode, dataType: string, initial: Manual, writable: true }
              - { kind: tag, name: InletValve, dataType: boolean, initial: false, writable: true, history: true }
              - kind: folder
                name: Pump
                children:
                  - { kind: tag, name: Running, dataType: boolean, initial: false, writable: true, history: true }
                  - { kind: tag, name: Speed, unit: '%', min: 0, max: 100, initial: 35, writable: true, history: true }
                  - { kind: tag, name: Current, unit: A, decimals: 1, expression: "tag('./Running') ? 4 + tag('./Speed') * 0.18 : 0" }
          - kind: tag
            name: Pressure
            unit: bar
            decimals: 2
            source: { fn: randomWalk, min: 2, max: 8, step: 0.15 }
            history: { deadband: 0.02 }
            alarms:
              - { kind: hi, limit: 7.5, severity: high, delay: 3, deadband: 0.2, message: 'Header pressure high ({value} bar)' }
          - kind: tag
            name: Flow
            unit: m³/h
            decimals: 1
            description: Total outflow
            expression: "(tag('./Tank1/Pump/Running') ? tag('./Tank1/Pump/Speed') * 1.2 : 0) + (tag('./Tank2/Pump/Running') ? tag('./Tank2/Pump/Speed') * 1.2 : 0)"
            history: true
          - kind: tag
            name: Vibration
            unit: mm/s
            decimals: 2
            source: { fn: sine, min: 0.5, max: 9.6, period: 300, noise: 0.15 }
            history: true
            alarms:
              - { kind: hi, limit: 9, severity: medium, delay: 2, message: 'Blower vibration high ({value} mm/s)' }
          - { kind: tag, name: BlowerRunning, dataType: boolean, initial: true, writable: true }
          - { kind: tag, name: ProductionCount, source: { fn: counter, step: 1, min: 0, max: 1000000 }, history: { interval: 60 } }
          - { kind: tag, name: EmergencyStop, dataType: boolean, initial: false, writable: true, writeRole: operator, alarms: [ { kind: on, severity: critical, message: Emergency stop activated } ] }

      - kind: device
        name: Utilities
        driver: modbus-tcp
        enabled: false
        description: Example Modbus TCP PLC (enable and set host to your PLC)
        settings: { host: 192.168.1.50, port: 502, unitId: 1, pollMs: 1000 }
        children:
          - { kind: tag, name: CompressorPressure, unit: bar, source: { area: holding, address: 0, type: float32 }, history: true }
          - { kind: tag, name: CompressorRunning, dataType: boolean, writable: true, source: { area: coil, address: 0 } }
          - { kind: tag, name: Hours, source: { area: input, address: 10, type: uint32 } }
          - { kind: tag, name: TankTemp, unit: °C, source: { area: holding, address: 4, type: int16, scale: 0.1 } }

  # ═══════════════════════════ SMART HOME (IoT) ═══════════════════════════
  - kind: folder
    name: Home
    description: Connected home
    children:
      - kind: device
        name: Sensors
        driver: simulation
        settings: { intervalMs: 1000 }
        children:
          - { kind: tag, name: LivingRoomTemp, unit: °C, decimals: 1, source: { fn: sine, min: 18.5, max: 23.5, period: 900, noise: 0.05 }, history: true }
          - { kind: tag, name: LivingRoomHumidity, unit: '%', decimals: 0, source: { fn: randomWalk, min: 35, max: 60, step: 0.5 }, history: true }
          - { kind: tag, name: OutdoorTemp, unit: °C, decimals: 1, source: { fn: sine, min: 6, max: 17, period: 1800 }, history: true }
          - kind: tag
            name: Power
            unit: W
            decimals: 0
            source: { fn: randomWalk, min: 150, max: 4200, step: 120 }
            history: { deadband: 20 }
            alarms: [ { kind: hi, limit: 4000, severity: medium, delay: 10, message: 'House power demand high ({value} W)' } ]
          - { kind: tag, name: SolarPower, unit: W, decimals: 0, source: { fn: sine, min: 0, max: 3200, period: 1200 }, history: true }
          - { kind: tag, name: BatteryLevel, unit: '%', decimals: 0, source: { fn: triangle, min: 20, max: 100, period: 1800 }, history: true }
          - { kind: tag, name: FrontDoorOpen, dataType: boolean, source: { fn: toggle, period: 240 }, alarms: [ { kind: on, severity: low, delay: 60, message: Front door open for over a minute } ] }
          - { kind: tag, name: HallwayMotion, dataType: boolean, source: { fn: toggle, period: 47 } }
          - { kind: tag, name: WaterLeak, dataType: boolean, initial: false, writable: true, alarms: [ { kind: on, severity: critical, message: Water leak detected! } ] }

      - kind: device
        name: Devices
        driver: memory
        description: Virtual devices (replace by MQTT / REST tags for real hardware)
        children:
          - { kind: tag, name: LivingRoomLight, dataType: boolean, writable: true, history: true }
          - { kind: tag, name: LivingRoomDimmer, unit: '%', min: 0, max: 100, initial: 70, writable: true }
          - { kind: tag, name: KitchenLight, dataType: boolean, writable: true, history: true }
          - { kind: tag, name: BedroomLight, dataType: boolean, writable: true }
          - { kind: tag, name: HallwayLight, dataType: boolean, writable: true }
          - { kind: tag, name: GarageDoor, dataType: boolean, writable: true }
          - { kind: tag, name: AwayMode, dataType: boolean, writable: true }
          - { kind: tag, name: ThermostatSetpoint, unit: °C, min: 12, max: 28, initial: 21, decimals: 1, writable: true, history: true }
          - { kind: tag, name: Heating, dataType: boolean, writable: true, history: true, description: Boiler demand (driven by the Thermostat script) }
          - { kind: tag, name: SelfConsumption, unit: '%', decimals: 0, expression: "Math.min(100, tag('Home/Sensors/SolarPower') / Math.max(1, tag('Home/Sensors/Power')) * 100)" }

      - kind: device
        name: Zigbee
        driver: mqtt
        enabled: false
        description: Zigbee2MQTT / Tasmota / Shelly via an MQTT broker (enable and set url)
        settings: { url: 'mqtt://localhost:1883', clientId: nexus-scada }
        children:
          - { kind: tag, name: DeskLamp, dataType: boolean, writable: true, source: { topic: zigbee2mqtt/desk_lamp, path: state, onValue: 'ON', offValue: 'OFF', writeTopic: zigbee2mqtt/desk_lamp/set, writeTemplate: '{"state":"{{value}}"}' } }
          - { kind: tag, name: DeskLampBrightness, min: 0, max: 254, writable: true, source: { topic: zigbee2mqtt/desk_lamp, path: brightness, writeTopic: zigbee2mqtt/desk_lamp/set, writeTemplate: '{"brightness":{{value}}}' } }
          - { kind: tag, name: TasmotaPlug, dataType: boolean, writable: true, source: { topic: stat/plug1/POWER, onValue: 'ON', offValue: 'OFF', writeTopic: cmnd/plug1/POWER } }
          - { kind: tag, name: BedroomTemp, unit: °C, source: { topic: zigbee2mqtt/bedroom_sensor, path: temperature }, history: true }

      - kind: device
        name: HomeAssistant
        driver: rest
        enabled: false
        description: Home Assistant REST API (enable, set token)
        settings:
          baseUrl: http://homeassistant.local:8123
          pollMs: 5000
          headers: { Authorization: Bearer YOUR_LONG_LIVED_TOKEN }
        children:
          - { kind: tag, name: OutsideHumidity, unit: '%', source: { path: /api/states/sensor.outside_humidity, jsonPath: state } }
          - kind: tag
            name: PorchLight
            dataType: boolean
            writable: true
            source:
              path: /api/states/light.porch
              jsonPath: state
              writeOn: { method: POST, path: /api/services/light/turn_on, body: '{"entity_id":"light.porch"}' }
              writeOff: { method: POST, path: /api/services/light/turn_off, body: '{"entity_id":"light.porch"}' }

  # ═══════════════════════════ SYSTEM ═══════════════════════════
  - kind: folder
    name: System
    children:
      - kind: device
        name: Stats
        driver: sql
        settings: { pollMs: 5000 }
        children:
          - { kind: tag, name: AlarmEvents24h, source: { query: "SELECT count(*) FROM alarm_events WHERE ts > (strftime('%s','now') - 86400) * 1000" } }
          - { kind: tag, name: HistorySamples, source: { query: 'SELECT count(*) FROM history' } }
          - { kind: tag, name: AuditEntries, source: { query: 'SELECT count(*) FROM audit' } }
      - { kind: tag, name: Message, dataType: string, initial: Welcome to Nexus SCADA, writable: true }
      - { kind: tag, name: Heartbeat, dataType: number, initial: 0, writable: true }
  - kind: folder
    name: Sites
    children:
      - kind: device
        name: PumpStation
        driver: simulation
        description: Simulated equipment (replace driver with modbus-tcp / mqtt / rest for real hardware)
        settings:
          intervalMs: 1000
        children:
          - { kind: tag, name: WetWellLevel, dataType: number, initial: 50, writable: true, unit: "%", min: 0, max: 100, decimals: 1, writeRole: engineer, history: { deadband: 0.2 }, alarms: [ { kind: hi, limit: 85, severity: high, message: "Wet well level high ({value}%)" }, { kind: hihi, limit: 95, severity: critical, message: "Wet well overflow risk ({value}%)" }, { kind: lo, limit: 10, severity: medium, message: "Wet well level low ({value}%)" } ] }
          - { kind: tag, name: Inflow, source: { fn: sine, min: 60, max: 200, period: 600, noise: 4 }, dataType: number, history: true, unit: m³/h, decimals: 0 }
          - { kind: tag, name: Outflow, expression: "(tag('./Pump1/Running') ? tag('./Pump1/Speed') * 0.9 : 0) + (tag('./Pump2/Running') ? tag('./Pump2/Speed') * 0.9 : 0) + (tag('./Pump3/Running') ? tag('./Pump3/Speed') * 0.9 : 0)", history: true, unit: m³/h, decimals: 0 }
          - { kind: tag, name: DischargePressure, source: { fn: randomWalk, min: 3, max: 6, step: 0.05 }, dataType: number, history: true, unit: bar, decimals: 2, alarms: [ { kind: hi, limit: 5.8, severity: high, message: "Discharge pressure high ({value} bar)", delay: 5 } ] }
          - { kind: tag, name: Mode, dataType: string, initial: Auto, writable: true, states: { Auto: Automatic, Manual: Manual } }
          - { kind: tag, name: StartLevel, dataType: number, initial: 70, writable: true, unit: "%", min: 20, max: 95 }
          - { kind: tag, name: StopLevel, dataType: number, initial: 35, writable: true, unit: "%", min: 5, max: 80 }
          - kind: folder
            name: Pump1
            children:
              - { kind: tag, name: Running, dataType: boolean, initial: false, writable: true, history: true, states: { "false": Stopped, "true": Running } }
              - { kind: tag, name: Speed, dataType: number, initial: 75, writable: true, unit: "%", min: 0, max: 100 }
              - { kind: tag, name: Current, expression: "tag('./Running') ? 8 + tag('./Speed') * 0.32 : 0", history: true, unit: A, decimals: 1, alarms: [ { kind: hi, limit: 40, severity: high, message: "Pump 1 motor overload ({value} A)" } ] }
              - { kind: tag, name: Fault, dataType: boolean, initial: false, writable: true, alarms: [ { kind: on, severity: high, message: Pump 1 tripped } ] }
          - kind: folder
            name: Pump2
            children:
              - { kind: tag, name: Running, dataType: boolean, initial: false, writable: true, history: true, states: { "false": Stopped, "true": Running } }
              - { kind: tag, name: Speed, dataType: number, initial: 75, writable: true, unit: "%", min: 0, max: 100 }
              - { kind: tag, name: Current, expression: "tag('./Running') ? 8 + tag('./Speed') * 0.32 : 0", history: true, unit: A, decimals: 1, alarms: [ { kind: hi, limit: 40, severity: high, message: "Pump 2 motor overload ({value} A)" } ] }
              - { kind: tag, name: Fault, dataType: boolean, initial: false, writable: true, alarms: [ { kind: on, severity: high, message: Pump 2 tripped } ] }
          - kind: folder
            name: Pump3
            children:
              - { kind: tag, name: Running, dataType: boolean, initial: false, writable: true, history: true, states: { "false": Stopped, "true": Running } }
              - { kind: tag, name: Speed, dataType: number, initial: 75, writable: true, unit: "%", min: 0, max: 100 }
              - { kind: tag, name: Current, expression: "tag('./Running') ? 8 + tag('./Speed') * 0.32 : 0", history: true, unit: A, decimals: 1, alarms: [ { kind: hi, limit: 40, severity: high, message: "Pump 3 motor overload ({value} A)" } ] }
              - { kind: tag, name: Fault, dataType: boolean, initial: false, writable: true, alarms: [ { kind: on, severity: high, message: Pump 3 tripped } ] }
      - kind: device
        name: AHU1
        driver: simulation
        description: Simulated equipment (replace driver with modbus-tcp / mqtt / rest for real hardware)
        settings:
          intervalMs: 1000
        children:
          - { kind: tag, name: OutsideTemp, source: { fn: sine, min: 2, max: 32, period: 1800 }, dataType: number, history: true, unit: °C, decimals: 1 }
          - { kind: tag, name: ReturnTemp, source: { fn: sine, min: 21, max: 25, period: 900 }, dataType: number, history: true, unit: °C, decimals: 1 }
          - { kind: tag, name: OADamper, dataType: number, initial: 30, writable: true, unit: "%", min: 0, max: 100, history: true }
          - { kind: tag, name: MixedTemp, expression: tag('./OutsideTemp') * tag('./OADamper') / 100 + tag('./ReturnTemp') * (1 - tag('./OADamper') / 100), history: true, unit: °C, decimals: 1 }
          - { kind: tag, name: HeatingValve, dataType: number, initial: 0, writable: true, unit: "%", min: 0, max: 100, history: true }
          - { kind: tag, name: CoolingValve, dataType: number, initial: 0, writable: true, unit: "%", min: 0, max: 100, history: true }
          - { kind: tag, name: SupplyTemp, expression: "tag('./SupplyFan') ? tag('./MixedTemp') + tag('./HeatingValve') * 0.18 - tag('./CoolingValve') * 0.16 : tag('./MixedTemp')", history: true, unit: °C, decimals: 1, alarms: [ { kind: hi, limit: 30, severity: medium, message: "Supply air too warm ({value} °C)", delay: 30 }, { kind: lo, limit: 10, severity: high, message: "Supply air too cold ({value} °C)", delay: 30 } ] }
          - { kind: tag, name: SupplySetpoint, dataType: number, initial: 18, writable: true, unit: °C, min: 12, max: 26, decimals: 1, history: true }
          - { kind: tag, name: SupplyFan, dataType: boolean, initial: true, writable: true, history: true }
          - { kind: tag, name: FanSpeed, dataType: number, initial: 70, writable: true, unit: "%", min: 20, max: 100 }
          - { kind: tag, name: ReturnFan, dataType: boolean, initial: true, writable: true }
          - { kind: tag, name: FilterDP, source: { fn: randomWalk, min: 80, max: 280, step: 3 }, dataType: number, history: true, unit: Pa, decimals: 0, alarms: [ { kind: hi, limit: 250, severity: low, message: "Filter dirty — replace ({value} Pa)" } ] }
          - { kind: tag, name: CO2, source: { fn: randomWalk, min: 420, max: 1300, step: 15 }, dataType: number, history: true, unit: ppm, decimals: 0, alarms: [ { kind: hi, limit: 1100, severity: medium, message: "CO₂ high in zone ({value} ppm)", delay: 20 } ] }
          - { kind: tag, name: FrostAlarm, expression: tag('./MixedTemp') < 4, history: false, dataType: boolean, alarms: [ { kind: on, severity: critical, message: Frost protection — coil at risk } ] }
      - kind: device
        name: SolarPlant
        driver: simulation
        description: Simulated equipment (replace driver with modbus-tcp / mqtt / rest for real hardware)
        settings:
          intervalMs: 1000
        children:
          - { kind: tag, name: Irradiance, source: { fn: sine, min: 0, max: 1000, period: 1800, noise: 15 }, dataType: number, history: true, unit: W/m², decimals: 0 }
          - { kind: tag, name: PVPower, expression: "Math.max(0, tag('./Irradiance') * 8.2)", history: true, unit: W, decimals: 0 }
          - { kind: tag, name: LoadPower, source: { fn: randomWalk, min: 400, max: 6500, step: 150 }, dataType: number, history: true, unit: W, decimals: 0 }
          - { kind: tag, name: BatterySOC, dataType: number, initial: 55, writable: true, unit: "%", min: 0, max: 100, decimals: 0, writeRole: engineer, history: true, alarms: [ { kind: lo, limit: 15, severity: medium, message: "Battery state of charge low ({value}%)" } ] }
          - { kind: tag, name: BatteryPower, dataType: number, initial: 0, writable: true, unit: W, decimals: 0, writeRole: engineer, history: true, description: + charging / − discharging }
          - { kind: tag, name: GridPower, expression: tag('./LoadPower') - tag('./PVPower') + tag('./BatteryPower'), history: true, unit: W, decimals: 0, description: + import / − export }
          - { kind: tag, name: InverterTemp, expression: 28 + tag('./PVPower') / 380, history: true, unit: °C, decimals: 1, alarms: [ { kind: hi, limit: 48, severity: high, message: "Inverter temperature high ({value} °C)" } ] }
          - { kind: tag, name: EnergyToday, dataType: number, initial: 0, writable: true, unit: kWh, decimals: 1, writeRole: engineer, history: true }
          - { kind: tag, name: Reserve, dataType: number, initial: 20, writable: true, unit: "%", min: 0, max: 80 }
          - { kind: tag, name: ChargeLimit, dataType: number, initial: 5000, writable: true, unit: W, min: 0, max: 10000 }
      - kind: device
        name: BoilerHouse
        driver: simulation
        description: Simulated equipment (replace driver with modbus-tcp / mqtt / rest for real hardware)
        settings:
          intervalMs: 1000
        children:
          - { kind: tag, name: HeaderPressure, dataType: number, initial: 9, writable: true, unit: bar, decimals: 2, writeRole: engineer, history: true, alarms: [ { kind: hi, limit: 10.5, severity: high, message: "Steam header pressure high ({value} bar)" }, { kind: lo, limit: 7, severity: medium, message: "Steam header pressure low ({value} bar)" } ] }
          - { kind: tag, name: PressureSetpoint, dataType: number, initial: 9, writable: true, unit: bar, min: 6, max: 10.5, decimals: 1 }
          - { kind: tag, name: SteamDemand, source: { fn: randomWalk, min: 2, max: 9, step: 0.2 }, dataType: number, history: true, unit: t/h, decimals: 1 }
          - kind: folder
            name: Boiler1
            children:
              - { kind: tag, name: Enabled, dataType: boolean, initial: true, writable: true }
              - { kind: tag, name: Firing, dataType: boolean, initial: true, writable: true }
              - { kind: tag, name: Modulation, dataType: number, initial: 50, writable: true, unit: "%", min: 0, max: 100, history: true }
              - { kind: tag, name: DrumLevel, source: { fn: sine, min: 42, max: 68, period: 370 }, dataType: number, history: true, unit: "%", decimals: 0, alarms: [ { kind: lo, limit: 35, severity: critical, message: Boiler 1 low water level } ] }
              - { kind: tag, name: FlueTemp, expression: "tag('./Firing') ? 140 + tag('./Modulation') * 0.9 : 60", history: true, unit: °C, decimals: 0, alarms: [ { kind: hi, limit: 225, severity: medium, message: Boiler 1 flue gas temperature high } ] }
              - { kind: tag, name: SteamOutput, expression: "tag('./Firing') ? tag('./Modulation') * 0.06 : 0", history: true, unit: t/h, decimals: 2 }
          - kind: folder
            name: Boiler2
            children:
              - { kind: tag, name: Enabled, dataType: boolean, initial: true, writable: true }
              - { kind: tag, name: Firing, dataType: boolean, initial: false, writable: true }
              - { kind: tag, name: Modulation, dataType: number, initial: 0, writable: true, unit: "%", min: 0, max: 100, history: true }
              - { kind: tag, name: DrumLevel, source: { fn: sine, min: 42, max: 68, period: 440 }, dataType: number, history: true, unit: "%", decimals: 0, alarms: [ { kind: lo, limit: 35, severity: critical, message: Boiler 2 low water level } ] }
              - { kind: tag, name: FlueTemp, expression: "tag('./Firing') ? 140 + tag('./Modulation') * 0.9 : 60", history: true, unit: °C, decimals: 0, alarms: [ { kind: hi, limit: 225, severity: medium, message: Boiler 2 flue gas temperature high } ] }
              - { kind: tag, name: SteamOutput, expression: "tag('./Firing') ? tag('./Modulation') * 0.06 : 0", history: true, unit: t/h, decimals: 2 }
          - { kind: tag, name: FeedPump, dataType: boolean, initial: true, writable: true, history: true }
          - { kind: tag, name: GasFlow, expression: "(tag('./Boiler1/Firing') ? tag('./Boiler1/Modulation') * 4.2 : 0) + (tag('./Boiler2/Firing') ? tag('./Boiler2/Modulation') * 4.2 : 0)", history: true, unit: m³/h, decimals: 0 }
      - kind: device
        name: TankFarm
        driver: simulation
        description: Simulated equipment (replace driver with modbus-tcp / mqtt / rest for real hardware)
        settings:
          intervalMs: 1000
        children:
          - kind: folder
            name: T1
