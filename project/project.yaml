              - { kind: tag, name: Product, dataType: string, initial: Water, writable: true }
              - { kind: tag, name: Capacity, dataType: number, initial: 300, writable: true, unit: m³, writeRole: engineer }
              - { kind: tag, name: Level, source: { fn: sine, min: 20, max: 83, period: 1110, phase: 3 }, dataType: number, history: true, unit: "%", decimals: 1, alarms: [ { kind: hi, limit: 90, severity: high, message: "Tank T4 high level ({value}%)" }, { kind: lo, limit: 10, severity: medium, message: "Tank T4 low level ({value}%)" } ] }
              - { kind: tag, name: Temperature, source: { fn: sine, min: 15, max: 27, period: 1200 }, dataType: number, history: true, unit: °C, decimals: 1 }
