          - { kind: tag, name: Humidity, source: { fn: randomWalk, min: 45, max: 92, step: 1 }, dataType: number, history: true, unit: "%", decimals: 0, alarms: [ { kind: hi, limit: 90, severity: low, message: Humidity high — fungal risk, delay: 60 } ] }
          - { kind: tag, name: SoilMoisture, dataType: number, initial: 40, writable: true, unit: "%", decimals: 1, writeRole: engineer, history: true, alarms: [ { kind: lo, limit: 22, severity: medium, message: "Soil too dry ({value}%)" } ] }
          - { kind: tag, name: Light, source: { fn: sine, min: 0, max: 60000, period: 1800 }, dataType: number, history: true, unit: lx, decimals: 0 }
