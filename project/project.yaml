        name: ColdStore
        driver: simulation
        description: Simulated equipment (replace driver with modbus-tcp / mqtt / rest for real hardware)
        settings:
          intervalMs: 1000
        children:
          - kind: folder
            name: Freezer1
            children:
              - { kind: tag, name: Temperature, source: { fn: sine, min: -24, max: -18, period: 700, noise: 0.15 }, dataType: number, history: true, unit: °C, decimals: 1, alarms: [ { kind: hi, limit: -18.6, severity: high, message: "Freezer1 temperature high ({value} °C)", delay: 30, deadband: 0.3 } ] }
              - { kind: tag, name: Setpoint, dataType: number, initial: -21, writable: true, unit: °C, min: -30, max: 15, decimals: 1 }
              - { kind: tag, name: DoorOpen, source: { fn: toggle, min: 0, max: 1, period: 200 }, dataType: boolean, history: false, alarms: [ { kind: on, severity: low, message: Freezer1 door open too long, delay: 45 } ] }
          - kind: folder
            name: Freezer2
            children:
              - { kind: tag, name: Temperature, source: { fn: sine, min: -22, max: -17, period: 830, noise: 0.15 }, dataType: number, history: true, unit: °C, decimals: 1, alarms: [ { kind: hi, limit: -17.6, severity: high, message: "Freezer2 temperature high ({value} °C)", delay: 30, deadband: 0.3 } ] }
              - { kind: tag, name: Setpoint, dataType: number, initial: -19, writable: true, unit: °C, min: -30, max: 15, decimals: 1 }
