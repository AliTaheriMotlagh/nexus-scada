# ─────────────────────────── Server scripts (TypeScript) ───────────────────────────
scripts:
  - name: Startup
    file: Startup.ts
    description: Runs once when the runtime starts
    triggers: [ { type: startup } ]
  - name: ProcessModel
    file: ProcessModel.ts
    description: Mass-balance model that fills/drains the tanks
    triggers: [ { type: interval, ms: 500 } ]
  - name: TankControl
    file: TankControl.ts
    description: Automatic level control for tanks in Auto mode
    triggers: [ { type: tagChange, tags: [ Plant/Area1/Tank1/Level, Plant/Area1/Tank2/Level, Plant/Area1/Tank1/Mode, Plant/Area1/Tank2/Mode ] } ]
  - name: Interlocks
    file: Interlocks.ts
    description: Safety interlocks (emergency stop, dry-run protection)
    triggers: [ { type: tagChange, tags: [ 'Plant/Area1/*' ] } ]
  - name: Thermostat
    file: Thermostat.ts
    description: Home heating control with away mode
    triggers: [ { type: interval, ms: 5000 }, { type: tagChange, tags: [ Home/Devices/ThermostatSetpoint, Home/Devices/AwayMode ] } ]
  - name: MotionLight
    file: MotionLight.ts
    description: Hallway light follows motion with a 60 s off-delay
    triggers: [ { type: tagChange, tags: [ Home/Sensors/HallwayMotion ] }, { type: interval, ms: 5000 } ]
  - name: AlarmNotifier
    file: AlarmNotifier.ts
    description: Push critical alarms to phones
    triggers: [ { type: alarm, minSeverity: critical } ]
  - name: HourlyReport
    file: HourlyReport.ts
    description: Hourly KPI report stored in the database
    triggers: [ { type: cron, cron: '0 * * * *' }, { type: manual } ]
  - name: PumpStationControl
    file: PumpStationControl.ts
    description: Wet-well model + lead/lag pump control with fail-over
    enabled: true
    triggers:
      - { type: interval, ms: 1000 }
  - name: AHU1Control
    file: AHU1Control.ts
    description: Sequenced heating/cooling valves + CO₂ demand ventilation
    enabled: true
    triggers:
      - { type: interval, ms: 2000 }
  - name: SolarPlantStrategy
    file: SolarPlantStrategy.ts
    description: Battery self-consumption strategy (time accelerated ×60 for the demo)
    enabled: true
    triggers:
      - { type: interval, ms: 2000 }
  - name: BoilerHouseControl
    file: BoilerHouseControl.ts
    description: Header pressure model + burner modulation + lead/lag firing
    enabled: true
    triggers:
      - { type: interval, ms: 1000 }
  - name: GreenhouseClimate
    file: GreenhouseClimate.ts
    description: Soil-moisture model + automatic climate & irrigation control
    enabled: true
    triggers:
      - { type: interval, ms: 2000 }
  - name: Line1Model
    file: Line1Model.ts
    description: Production counters, random stops and OEE time base
    enabled: true
    triggers:
      - { type: interval, ms: 1000 }
  - name: aliClimate
    file: aliClimate.ts
    description: Soil-moisture model + automatic climate & irrigation control
    enabled: true
    triggers:
      - { type: interval, ms: 2000 }

# ─────────────────────────── Schedules (cron, @every, @sunrise/@sunset ± offset) ───────────────────────────
schedules:
  - name: EveningLights
    cron: '@sunset-15m'
    description: Living room light on shortly before sunset
    actions: [ { write: Home/Devices/LivingRoomLight, value: true } ]
  - name: NightOff
    cron: '30 23 * * *'
    actions:
      - { write: Home/Devices/LivingRoomLight, value: false }
      - { write: Home/Devices/KitchenLight, value: false }
      - { write: Home/Devices/BedroomLight, value: false }
  - name: WeekdayMorningHeat
    cron: '0 6 * * 1-5'
    actions: [ { write: Home/Devices/ThermostatSetpoint, value: 21.5 } ]
  - name: Heartbeat
    cron: '@every 10s'
    actions: [ { script: HourlyReport } ]
    enabled: false

# ─────────────────────────── Recipes ───────────────────────────
recipes:
  - name: TankOperation
    description: Setpoints and pump speeds for both tanks
    tags:
      - Plant/Area1/Tank1/Setpoint
      - Plant/Area1/Tank2/Setpoint
      - Plant/Area1/Tank1/Pump/Speed
      - Plant/Area1/Tank2/Pump/Speed
    sets:
      Normal: { Plant/Area1/Tank1/Setpoint: 60, Plant/Area1/Tank2/Setpoint: 50, Plant/Area1/Tank1/Pump/Speed: 50, Plant/Area1/Tank2/Pump/Speed: 35 }
      HighThroughput: { Plant/Area1/Tank1/Setpoint: 75, Plant/Area1/Tank2/Setpoint: 70, Plant/Area1/Tank1/Pump/Speed: 65, Plant/Area1/Tank2/Pump/Speed: 60 }
      Maintenance: { Plant/Area1/Tank1/Setpoint: 30, Plant/Area1/Tank2/Setpoint: 30, Plant/Area1/Tank1/Pump/Speed: 20, Plant/Area1/Tank2/Pump/Speed: 20 }

# ─────────────────────────── Notifications ───────────────────────────
notifications:
  - { name: phone, type: ntfy, url: 'https://ntfy.sh/nexus-scada-demo-change-me', minSeverity: critical, enabled: false }
  # - { name: telegram, type: telegram, token: '123:ABC', chatId: '42', minSeverity: high }
  # - { name: ops, type: slack, url: 'https://hooks.slack.com/services/...', minSeverity: high }

  # ─────────────────────────── GIS map ───────────────────────────
map:
  center: [ 35.7, 51.39 ]
  zoom: 11
  tileUrl: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
  attribution: '© OpenStreetMap contributors'
  markers:
    - { id: plant, name: Water Treatment Plant, lat: 35.7219, lng: 51.3347, path: Plant/Area1, icon: factory, display: Plant/Overview, tags: [ Plant/Area1/Tank1/Level, Plant/Area1/Flow, Plant/Area1/Pressure ] }
    - { id: home, name: Smart Home, lat: 35.7575, lng: 51.4102, path: Home, icon: home, display: Home/Dashboard, tags: [ Home/Sensors/LivingRoomTemp, Home/Sensors/Power, Home/Sensors/SolarPower ] }
    - { id: reservoir, name: Treated Water Reservoir, lat: 35.6731, lng: 51.4410, path: Plant/Area1/Tank2, icon: tank, tags: [ Plant/Area1/Tank2/Level, Plant/Area1/Tank2/Temperature ] }
    - { id: pumpstation, name: Remote Pump Station, lat: 35.6420, lng: 51.3200, path: Plant/Utilities, icon: pump, tags: [ Plant/Utilities/CompressorPressure ] }
