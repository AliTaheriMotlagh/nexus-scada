              - { kind: tag, name: Capacity, dataType: number, initial: 500, writable: true, unit: m³, writeRole: engineer }
              - { kind: tag, name: Level, source: { fn: sine, min: 8, max: 92, period: 600, phase: 0 }, dataType: number, history: true, unit: "%", decimals: 1, alarms: [ { kind: hi, limit: 90, severity: high, message: "Tank T1 high level ({value}%)" }, { kind: lo, limit: 10, severity: medium, message: "Tank T1 low level ({value}%)" } ] }
              - { kind: tag, name: Temperature, source: { fn: sine, min: 12, max: 24, period: 1200 }, dataType: number, history: true, unit: °C, decimals: 1 }
              - { kind: tag, name: Volume, expression: tag('./Level') / 100 * tag('./Capacity'), history: true, unit: m³, decimals: 0 }
          - kind: folder
