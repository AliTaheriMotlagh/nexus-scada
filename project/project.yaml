          - { kind: tag, name: VoltageL2, source: { fn: randomWalk, min: 224, max: 238, step: 0.6 }, dataType: number, history: true, unit: V, decimals: 1, alarms: [ { kind: hi, limit: 236, severity: low, message: Overvoltage L2, delay: 10 } ] }
          - { kind: tag, name: VoltageL3, source: { fn: randomWalk, min: 224, max: 238, step: 0.6 }, dataType: number, history: true, unit: V, decimals: 1, alarms: [ { kind: hi, limit: 236, severity: low, message: Overvoltage L3, delay: 10 } ] }
          - { kind: tag, name: CurrentL1, source: { fn: randomWalk, min: 60, max: 240, step: 6 }, dataType: number, history: true, unit: A, decimals: 0 }
          - { kind: tag, name: CurrentL2, source: { fn: randomWalk, min: 60, max: 240, step: 6 }, dataType: number, history: true, unit: A, decimals: 0 }
          - { kind: tag, name: CurrentL3, source: { fn: randomWalk, min: 60, max: 240, step: 6 }, dataType: number, history: true, unit: A, decimals: 0 }
          - { kind: tag, name: PowerFactor, source: { fn: randomWalk, min: 0.84, max: 0.99, step: 0.006 }, dataType: number, history: true, unit: "", decimals: 3, alarms: [ { kind: lo, limit: 0.88, severity: medium, message: "Poor power factor ({value})", delay: 20 } ] }
          - { kind: tag, name: Frequency, source: { fn: randomWalk, min: 49.9, max: 50.1, step: 0.01 }, dataType: number, history: true, unit: Hz, decimals: 2 }
          - { kind: tag, name: ActivePower, expression: (tag('./VoltageL1') * tag('./CurrentL1') + tag('./VoltageL2') * tag('./CurrentL2') + tag('./VoltageL3') * tag('./CurrentL3')) * tag('./PowerFactor') / 1000, history: true, unit: kW, decimals: 1, alarms: [ { kind: hi, limit: 140, severity: high, message: "Demand above contract ({value} kW)", delay: 30 } ] }
          - { kind: tag, name: EnergyToday, source: { fn: counter, min: 0, max: 1000000000, step: 0.03 }, dataType: number, history: true, unit: kWh, decimals: 1 }
          - { kind: tag, name: HVAC, source: { fn: randomWalk, min: 2, max: 18, step: 0.8 }, dataType: number, history: true, unit: kW, decimals: 1 }
          - { kind: tag, name: Lighting, source: { fn: randomWalk, min: 3, max: 24, step: 0.8 }, dataType: number, history: true, unit: kW, decimals: 1 }
          - { kind: tag, name: Production, source: { fn: randomWalk, min: 4, max: 30, step: 0.8 }, dataType: number, history: true, unit: kW, decimals: 1 }
          - { kind: tag, name: Office, source: { fn: randomWalk, min: 5, max: 36, step: 0.8 }, dataType: number, history: true, unit: kW, decimals: 1 }
          - { kind: tag, name: EVCharging, source: { fn: randomWalk, min: 6, max: 42, step: 0.8 }, dataType: number, history: true, unit: kW, decimals: 1 }
      - kind: device
