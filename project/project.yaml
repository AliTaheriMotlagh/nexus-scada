          - { kind: tag, name: BedroomLight, dataType: boolean, initial: false, writable: true, history: true }
          - { kind: tag, name: PorchLight, dataType: boolean, initial: false, writable: true, history: true }
          - { kind: tag, name: Temperature, source: { fn: sine, min: 19, max: 24, period: 900 }, dataType: number, history: true, unit: °C, decimals: 1 }
          - { kind: tag, name: Setpoint, dataType: number, initial: 21, writable: true, unit: °C, min: 15, max: 27, decimals: 1 }
          - { kind: tag, name: Heating, expression: tag('./Temperature') < tag('./Setpoint') - 0.3, history: true, dataType: boolean }
          - { kind: tag, name: Garage, dataType: boolean, initial: false, writable: true }
